name: Bug report
description: Report something broken in one of the Ross Valheim mods
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The more of the below you fill in the faster this can be pinned down — the log especially. Most bugs turn out to be conflicts with another mod, so the mod list and log matter as much as the description.
  - type: dropdown
    id: mod
    attributes:
      label: Which mod?
      options:
        - RossItemDrawers
        - RossQoL
        - RossPortals
        - Not sure
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Mod version
      description: The version showing the bug. It is printed in the log as "<Mod> <version> loaded".
      placeholder: "e.g. 1.0.13"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps that trigger it, numbered.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What you expected to happen, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How are you playing?
      description: Some bugs only happen on a dedicated server or in multiplayer, so this narrows it down a lot.
      options:
        - Single-player
        - Player-hosted co-op
        - Dedicated server
    validations:
      required: true
  - type: input
    id: valheim-version
    attributes:
      label: Valheim version
      description: Shown in the bottom corner of the main menu (e.g. "0.220.5 (n-40)").
    validations:
      required: true
  - type: input
    id: bepinex-version
    attributes:
      label: BepInEx version
    validations:
      required: false
  - type: input
    id: jotunn-version
    attributes:
      label: Jotunn version
      description: These mods depend on Jotunn. Its version is in the log if you are unsure.
    validations:
      required: false
  - type: dropdown
    id: install-method
    attributes:
      label: How did you install the mods?
      options:
        - r2modman / Thunderstore Mod Manager
        - Thunderstore website (manual)
        - Manually / other
    validations:
      required: true
  - type: textarea
    id: other-mods
    attributes:
      label: Other mods installed
      description: The full list, with versions if you can. On a dedicated server, note which are on the server as well as the client. This is often the key to a bug.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: LogOutput.log
      description: |
        Paste the contents (or the relevant part), or drag the file in.
        Find it at `BepInEx/LogOutput.log` inside your profile. With r2modman that is:
        `AppData/Roaming/r2modmanPlus-local/Valheim/profiles/<profile>/BepInEx/LogOutput.log`
      render: text
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I am on the latest version of the mod.
          required: true
        - label: I tried reproducing with only this mod and its dependencies enabled (helps rule out a conflict).
          required: false
